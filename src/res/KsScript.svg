<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Play Button Accent Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Status Indicator Gradient -->
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-Canvas Edge-to-Edge Container -->
  <rect x="0" y="0" width="512" height="512" fill="#1E293B"/>

  <!-- Scaled Script Command Lines -->
  <line x1="64" y1="110" x2="280" y2="110" stroke="#64748B" stroke-width="18" stroke-linecap="round"/>
  <line x1="64" y1="180" x2="210" y2="180" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
  <line x1="64" y1="250" x2="320" y2="250" stroke="#64748B" stroke-width="18" stroke-linecap="round"/>
  <line x1="64" y1="320" x2="180" y2="320" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
  <line x1="64" y1="390" x2="250" y2="390" stroke="#475569" stroke-width="18" stroke-linecap="round"/>

  <!-- Larger Play Button Triangle spanning the expanded layout -->
  <polygon points="280,180 440,280 280,380" fill="url(#playGrad)" filter="url(#glow)"/>
  <polygon points="295,205 415,280 295,355" fill="#FFFFFF" opacity="0.85"/>

  <!-- Active Execution Badge -->
  <circle cx="440" cy="80" r="20" fill="url(#activeGrad)"/>
</svg>
